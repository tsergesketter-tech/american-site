<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00205B" />
    <meta
      name="description"
      content="American Airlines - Book flights, check-in, and manage your travel"
    />
    <title>American Airlines - Book flights</title>

    <!-- Salesforce Interactions SDK (Data Cloud / Personalization) -->
    <script src="https://cdn.c360a.salesforce.com/beacon/c360a/d0d652ae-8c12-4826-801a-05e6f178b317/scripts/c360a.min.js"></script>
    <script>
      // Initialize the SDK after it loads
      // Sitemap is loaded automatically from Personalization configuration
      (function() {
        if (typeof SalesforceInteractions !== 'undefined') {
          SalesforceInteractions.init({
            cookieDomain: window.location.hostname,
            consents: [{
              purpose: SalesforceInteractions.ConsentPurpose?.Personalization || 'Personalization',
              status: SalesforceInteractions.ConsentStatus?.OptIn || 'OptIn'
            }]
          }).then(function() {
            console.log('✅ Salesforce Interactions SDK initialized');
          }).catch(function(err) {
            console.warn('⚠️ SDK init error:', err);
          });
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
